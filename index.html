<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lead Finder</title>
<style>
:root{--bg:#0b0c0e;--panel:#121418;--panel2:#17191e;--line:#272a31;--text:#f5f6f8;--muted:#9097a3;--accent:#fff;--good:#7ee787;--bad:#ff7b72}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#181b21 0,#0b0c0e 34%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:42px 22px 70px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:24px}.brand h1{font-size:34px;letter-spacing:-1.3px;margin:0 0 7px}.brand p{margin:0;color:var(--muted)}.badge{border:1px solid var(--line);background:#14161a;padding:8px 12px;border-radius:999px;font-size:12px;color:#b8bec8}.card{background:rgba(18,20,24,.95);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 18px 50px #0005}.grid{display:grid;grid-template-columns:1.4fr 1.1fr .7fr .8fr .65fr;gap:12px}.field label{display:block;color:#aeb4bd;font-size:12px;margin:0 0 7px}.field input{width:100%;height:44px;background:#0e1013;border:1px solid #2b2e35;border-radius:10px;padding:0 12px;color:white;outline:none}.field input:focus{border-color:#5b606b}.checks{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0}.checks label{color:#c7cbd2;font-size:14px;display:flex;gap:8px;align-items:center}.checks input{accent-color:white}.actions{display:flex;gap:10px;align-items:center}.primary,.secondary,.wa{border:0;border-radius:10px;font-weight:750;cursor:pointer}.primary{height:45px;padding:0 18px;background:#f4f5f7;color:#111}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{height:40px;padding:0 14px;background:#22252b;color:#e7e9ec;border:1px solid #31353d}.status{margin-left:auto;color:#9aa1ac;font-size:13px}.progress{height:4px;background:#202329;border-radius:9px;overflow:hidden;margin-top:16px;display:none}.bar{height:100%;width:32%;background:white;border-radius:8px;animation:move 1.1s infinite ease-in-out}@keyframes move{0%{transform:translateX(-120%)}100%{transform:translateX(430%)}}.results{margin-top:18px;display:none}.resultHead{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}.resultHead h2{font-size:17px;margin:0}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:920px;background:#101216}th,td{padding:13px 14px;text-align:left;border-bottom:1px solid #24272d;font-size:13px}th{color:#9198a3;background:#15171b;font-size:11px;text-transform:uppercase;letter-spacing:.5px}tr:last-child td{border-bottom:0}.name{font-weight:700;max-width:250px}.muted{color:#8f96a1}.no{color:#8e949e}.yes{color:var(--good)}.wa{display:inline-flex;align-items:center;text-decoration:none;padding:8px 10px;background:#20242a;color:#fff;border:1px solid #30353d;font-size:12px}.wa:hover{background:#292e35}.empty{padding:30px;text-align:center;color:#979ea8}.error{color:var(--bad)}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding:25px 14px}.brand h1{font-size:29px}.status{width:100%;margin:0}.actions{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand"><h1>Lead Finder</h1><p>Encontre empresas no Google Maps sem API paga.</p></div><div class="badge">Vercel • Google Maps</div></div>
  <section class="card">
    <div class="grid">
      <div class="field"><label>Nicho</label><input id="niche" placeholder="Ex.: barbearia" /></div>
      <div class="field"><label>Cidade</label><input id="city" placeholder="Ex.: Taboão da Serra" /></div>
      <div class="field"><label>Avaliação mínima</label><input id="rating" type="number" min="0" max="5" step="0.1" value="4" /></div>
      <div class="field"><label>Mín. de avaliações</label><input id="reviews" type="number" min="0" value="5" /></div>
      <div class="field"><label>Máx. de leads</label><input id="max" type="number" min="1" max="20" value="10" /></div>
    </div>
    <div class="checks"><label><input id="phone" type="checkbox" checked /> Ter telefone</label><label><input id="noSite" type="checkbox" /> Não ter site</label></div>
    <div class="actions"><button class="primary" id="search">ENCONTRAR LEADS</button><button class="secondary" id="csv" style="display:none">BAIXAR CSV</button><span class="status" id="status">Pronto para buscar.</span></div>
    <div class="progress" id="progress"><div class="bar"></div></div>
  </section>
  <section class="results" id="results">
    <div class="resultHead"><h2 id="title">Resultados</h2></div>
    <div class="tableWrap"><table><thead><tr><th>Empresa</th><th>Avaliação</th><th>Avaliações</th><th>Telefone</th><th>Site</th><th>WhatsApp</th><th>Maps</th></tr></thead><tbody id="body"></tbody></table></div>
  </section>
</div>
<script>
const $=id=>document.getElementById(id);
const MESSAGE='Olá, tudo bem? Conheci a empresa de vocês e desenvolvi um site especialmente pensado para o negócio. Gostaria de apresentar o projeto a vocês. Posso enviar para que possam conhecer? Caso gostem, podemos conversar e negociar o valor.';
let current=[];
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(leads){current=leads;$('results').style.display='block';$('csv').style.display=leads.length?'inline-block':'none';$('title').textContent=`Resultados (${leads.length})`;if(!leads.length){$('body').innerHTML='<tr><td colspan="7" class="empty">Nenhum lead passou pelos filtros.</td></tr>';return}$('body').innerHTML=leads.map(l=>{const wa=l.whatsapp?`https://wa.me/${encodeURIComponent(l.whatsapp)}?text=${encodeURIComponent(MESSAGE)}`:'';return `<tr><td class="name">${esc(l.name)}</td><td>★ ${Number(l.rating||0).toFixed(1)}</td><td>${l.reviews||0}</td><td>${esc(l.phone||'—')}</td><td class="${l.website?'yes':'no'}">${l.website?'<a class="wa" target="_blank" href="'+esc(l.website)+'">Abrir site</a>':'Sem site'}</td><td>${wa?'<a class="wa" target="_blank" rel="noopener" href="'+wa+'">Abrir WhatsApp</a>':'—'}</td><td><a class="wa" target="_blank" rel="noopener" href="${esc(l.mapsUrl)}">Maps</a></td></tr>`}).join('')}
$('search').onclick=async()=>{const payload={niche:$('niche').value.trim(),city:$('city').value.trim(),minRating:Number($('rating').value)||0,minReviews:Number($('reviews').value)||0,noWebsite:$('noSite').checked,requirePhone:$('phone').checked,maxLeads:Number($('max').value)||10};if(!payload.niche||!payload.city){$('status').innerHTML='<span class="error">Informe nicho e cidade.</span>';return}$('search').disabled=true;$('progress').style.display='block';$('status').textContent='Buscando empresas e analisando os resultados…';try{const r=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw new Error(data.error||'Erro na busca');render(data.leads||[]);$('status').textContent=`Concluído: ${data.count||0} lead(s).`}catch(e){$('status').innerHTML=`<span class="error">${esc(e.message)}</span>`}finally{$('search').disabled=false;$('progress').style.display='none'}};
$('csv').onclick=()=>{if(!current.length)return;const rows=[['Empresa','Avaliacao','Avaliacoes','Telefone','Site','Google Maps'],...current.map(l=>[l.name,l.rating,l.reviews,l.phone,l.website,l.mapsUrl])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='leads.csv';a.click();URL.revokeObjectURL(a.href)};
</script>
</body>
</html>
